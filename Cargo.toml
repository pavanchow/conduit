[package]
name = "conduit"
version = "0.1.0"
edition = "2021"
authors = ["Pavan Nallamothu <pavankumarpre@gmail.com>"]
description = "A from-scratch PostgreSQL driver that speaks the v3 wire protocol with zero dependencies"
license = "MIT"
repository = "https://github.com/pavanchow/conduit"

[[bin]]
name = "conduit"
path = "src/main.rs"

[lib]
name = "conduit"
path = "src/lib.rs"

[dependencies]
